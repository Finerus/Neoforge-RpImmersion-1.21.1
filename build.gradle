plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group   = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
    maven { url "https://maven.txni.dev/releases" }
    maven { url "https://maven.su5ed.dev/releases" }
    maven { url "https://api.modrinth.com/maven" }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion  = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ImmersiveMessages — optional client (compileOnly = ne crash pas si absent en runtime)
    compileOnly("toni.immersivemessages:neoforge-1.21.1:1.0.18") { transitive = false }

    // TxniLib — requis par ImmersiveMessages côté client
    compileOnly "maven.modrinth:txnilib:neoforge-1.21.1-1.0.24"

    // Compile : rpimmersion voit les classes de rpessentials
    compileOnly "net.rpessentials:rpessentials:${rpessentials_version}"

    // Runtime dev : rpessentials est chargé quand tu lances le jeu via Gradle
    // Sans ça → ClassNotFoundException au démarrage
    localRuntime "net.rpessentials:rpessentials:${rpessentials_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}